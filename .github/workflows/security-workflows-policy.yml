name: security-workflows-policy

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  POLICY_BASELINE_VERSION: SECURITY-POLICY-BASELINE-1

jobs:
  security-workflows-policy:
    name: security-workflows-policy
    runs-on: windows-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: candidate

      - name: Check out independent root policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KiloAlpha021/security-policy
          ref: main
          fetch-depth: 0
          path: policy

      - name: Set up CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.10

      - name: Assert exact CPython runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonVersion = python -c "import platform; print(platform.python_version())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($pythonVersion -ne '3.12.10') { throw 'Unexpected CPython version' }

      - name: Acquire protected Git identity
        id: protected-git
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $protectedSha = (git -C "${{ github.workspace }}/policy" rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($protectedSha -notmatch '^[0-9a-f]{40}$') { throw 'Malformed protected-policy SHA' }
          "protected-sha=$protectedSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Resolve protected bootstrap authority
        id: protected-bootstrap
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidateRoot = "${{ github.workspace }}/candidate"
          $candidateSha = "${{ github.sha }}"
          git -C $candidateRoot config core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $candidateRoot reset --hard $candidateSha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $observedHead = (git -C $candidateRoot rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($observedHead -ne $candidateSha) { throw 'Candidate HEAD differs from authorized candidate SHA' }
          $workflowPath = '.github/workflows/security-workflows-policy.yml'
          $expectedBlob = (git -C $candidateRoot rev-parse "${candidateSha}:$workflowPath").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($expectedBlob -notmatch '^[0-9a-f]{40}$') { throw 'Malformed committed candidate workflow blob' }
          $actualBlob = (git -C $candidateRoot hash-object --no-filters $workflowPath).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actualBlob -ne $expectedBlob) { throw 'Candidate workflow bytes differ from exact committed Git blob' }
          python -I -S "${{ github.workspace }}/policy/protected_policy_bootstrap.py" evaluate --event-name "${{ github.event_name }}" --repository "${{ github.repository }}" --base-repository "${{ github.event.pull_request.base.repo.full_name || github.repository }}" --base-branch "${{ github.event.pull_request.base.ref || 'main' }}" --candidate-sha "${{ github.sha }}" --protected-sha "${{ steps.protected-git.outputs.protected-sha }}" --candidate-root "${{ github.workspace }}/candidate" --protected-root "${{ github.workspace }}/policy" --event-ref "${{ github.ref }}" --default-branch "${{ github.event.repository.default_branch || 'main' }}" --workflow-ref "${{ github.workflow_ref }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assert protected bootstrap outputs
        shell: pwsh
        env:
          EVALUATION_CONTEXT: ${{ steps.protected-bootstrap.outputs.evaluation-context }}
          POLICY_SOURCE: ${{ steps.protected-bootstrap.outputs.policy-source }}
          VERSION_DISPOSITION: ${{ steps.protected-bootstrap.outputs.version-disposition }}
          OWNER_AUTHORIZATION: ${{ steps.protected-bootstrap.outputs.owner-authorization }}
          POST_MERGE_PROOF: ${{ steps.protected-bootstrap.outputs.post-merge-proof }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVALUATION_CONTEXT -notin @('SELF_PR_BOOTSTRAP', 'STAGE_A_PROTECTED_PROOF', 'DOWNSTREAM_SECURITY_WORKFLOWS')) { throw 'Invalid protected evaluation context output' }
          if ($env:POLICY_SOURCE -notin @('candidate', 'policy')) { throw 'Invalid protected policy source output' }
          if ($env:VERSION_DISPOSITION -notin @('SAME_VERSION', 'IMMEDIATE_SUCCESSOR')) { throw 'Invalid protected version disposition output' }
          if ($env:OWNER_AUTHORIZATION -ne 'REQUIRED') { throw 'Owner authorization output is not REQUIRED' }
          if ($env:POST_MERGE_PROOF -ne 'REQUIRED') { throw 'Post-merge proof output is not REQUIRED' }

      - name: Enforce exact P0b-2 self-PR admission
        if: steps.protected-bootstrap.outputs.evaluation-context == 'SELF_PR_BOOTSTRAP'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ("${{ steps.protected-git.outputs.protected-sha }}" -ne '1211595f9b0b5d1e76dd892bb210fece54f24b53') { throw 'P0b-2 transition expired after protected-main movement' }
          $changed = @(git -C "${{ github.workspace }}/candidate" diff --name-status --no-renames "${{ steps.protected-git.outputs.protected-sha }}" "${{ github.sha }}")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($changed.Count -ne 2) { throw 'P0b-2 requires exactly two modified protected files' }
          $workflowRecord = 'M' + [char]9 + '.github/workflows/security-workflows-policy.yml'
          $testRecord = 'M' + [char]9 + 'test_verify_security_workflows.py'
          if ($changed[0] -cne $workflowRecord) { throw 'P0b-2 workflow admission mismatch' }
          if ($changed[1] -cne $testRecord) { throw 'P0b-2 test admission mismatch' }

      - name: Normalize and verify committed policy bytes
        shell: pwsh
        env:
          POLICY_SOURCE: ${{ steps.protected-bootstrap.outputs.policy-source }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($root in @('candidate', 'policy')) {
            git -C $root config core.autocrlf false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git -C $root reset --hard HEAD
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($lock in @('requirements-policy.lock', 'requirements-audit.lock')) {
            $expected = (git -C $env:POLICY_SOURCE rev-parse "HEAD:$lock").Trim()
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $actual = (git hash-object --no-filters "$env:POLICY_SOURCE/$lock").Trim()
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($actual -ne $expected) { throw 'Policy lock bytes differ from committed Git bytes' }
          }

      - name: Install isolated hash-locked policy environment
        shell: pwsh
        env:
          POLICY_SOURCE: ${{ steps.protected-bootstrap.outputs.policy-source }}
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv policy-env
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\policy-env\Scripts\python.exe -m pip install --require-hashes --only-binary=:all: -r "$env:POLICY_SOURCE/requirements-policy.lock"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\policy-env\Scripts\python.exe -c "import yaml; assert yaml.__version__ == '6.0.3'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\policy-env\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run candidate Stage A evidence
        if: steps.protected-bootstrap.outputs.evaluation-context == 'SELF_PR_BOOTSTRAP' || steps.protected-bootstrap.outputs.evaluation-context == 'STAGE_A_PROTECTED_PROOF'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\policy-env\Scripts\python.exe -m unittest discover -s candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run legacy protected health
        if: steps.protected-bootstrap.outputs.evaluation-context == 'SELF_PR_BOOTSTRAP'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\policy-env\Scripts\python.exe -m unittest discover -s policy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply protected Stage A baseline to candidate target
        if: steps.protected-bootstrap.outputs.evaluation-context == 'STAGE_A_PROTECTED_PROOF'
        shell: pwsh
        env:
          POLICY_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          POLICY_PROTECTED_ROOT: ${{ github.workspace }}/policy
          POLICY_EXPECTED_REPOSITORY: ${{ github.repository }}
          POLICY_EXPECTED_CANDIDATE_SHA: ${{ github.sha }}
          POLICY_EXPECTED_PROTECTED_SHA: ${{ steps.protected-git.outputs.protected-sha }}
          POLICY_EXPECTED_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          POLICY_EXPECTED_BASE_BRANCH: ${{ github.event.pull_request.base.ref || 'main' }}
          POLICY_EXPECTED_EVENT: ${{ github.event_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\policy-env\Scripts\python.exe policy/test_verify_security_workflows.py RootPolicyTests.test_protected_source_and_candidate_target_contract RootPolicyTests.test_stage_a_candidate_invariants RootPolicyTests.test_stage_a_target_binding_executes_in_isolated_git_roots
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test independent root policy
        if: steps.protected-bootstrap.outputs.evaluation-context == 'DOWNSTREAM_SECURITY_WORKFLOWS'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\policy-env\Scripts\python.exe -m unittest discover -s policy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install isolated hash-locked audit environment
        shell: pwsh
        env:
          POLICY_SOURCE: ${{ steps.protected-bootstrap.outputs.policy-source }}
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv audit-env
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\audit-env\Scripts\python.exe -m pip install --require-hashes --only-binary=:all: -r "$env:POLICY_SOURCE/requirements-audit.lock"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\audit-env\Scripts\python.exe -c "import pip_audit; from importlib.metadata import version; assert version('pip-audit') == '2.10.1'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\audit-env\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit locked policy dependencies
        shell: pwsh
        env:
          POLICY_SOURCE: ${{ steps.protected-bootstrap.outputs.policy-source }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\audit-env\Scripts\python.exe -m pip_audit --no-deps -r "$env:POLICY_SOURCE/requirements-policy.lock"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate downstream security workflows
        if: steps.protected-bootstrap.outputs.evaluation-context == 'DOWNSTREAM_SECURITY_WORKFLOWS'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\policy-env\Scripts\python.exe policy/verify_security_workflows.py --candidate candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
