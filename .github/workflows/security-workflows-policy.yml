name: security-workflows-policy

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  POLICY_BASELINE_VERSION: SECURITY-POLICY-BASELINE-1
  MODEL_D_MAINTENANCE_GENERATION: MODEL_D_ORCHESTRATION_V1_GENERATION_1

jobs:
  security-workflows-policy:
    name: security-workflows-policy
    runs-on: windows-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: candidate

      - name: Check out independent root policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KiloAlpha021/security-policy
          ref: main
          fetch-depth: 0
          path: policy

      - name: Set up CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.10

      - name: Assert exact CPython runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonVersion = python -c "import platform; print(platform.python_version())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($pythonVersion -ne '3.12.10') { throw 'Unexpected CPython version' }

      - name: Acquire protected Git identity
        id: protected-git
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $protectedSha = (git -C "${{ github.workspace }}/policy" rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($protectedSha -notmatch '^[0-9a-f]{40}$') { throw 'Malformed protected-policy SHA' }
          "protected-sha=$protectedSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Resolve protected bootstrap authority
        id: protected-bootstrap
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidateRoot = "${{ github.workspace }}/candidate"
          $candidateSha = "${{ github.sha }}"
          git -C $candidateRoot config core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $candidateRoot reset --hard $candidateSha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $observedHead = (git -C $candidateRoot rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($observedHead -ne $candidateSha) { throw 'Candidate HEAD differs from authorized candidate SHA' }
          $workflowPath = '.github/workflows/security-workflows-policy.yml'
          $expectedBlob = (git -C $candidateRoot rev-parse "${candidateSha}:$workflowPath").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($expectedBlob -notmatch '^[0-9a-f]{40}$') { throw 'Malformed committed candidate workflow blob' }
          $actualBlob = (git -C $candidateRoot hash-object --no-filters $workflowPath).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actualBlob -ne $expectedBlob) { throw 'Candidate workflow bytes differ from exact committed Git blob' }
          python -I -S "${{ github.workspace }}/policy/protected_policy_bootstrap.py" evaluate --event-name "${{ github.event_name }}" --repository "${{ github.repository }}" --base-repository "${{ github.event.pull_request.base.repo.full_name || github.repository }}" --base-branch "${{ github.event.pull_request.base.ref || 'main' }}" --candidate-sha "${{ github.sha }}" --protected-sha "${{ steps.protected-git.outputs.protected-sha }}" --candidate-root "${{ github.workspace }}/candidate" --protected-root "${{ github.workspace }}/policy" --event-ref "${{ github.ref }}" --default-branch "${{ github.event.repository.default_branch || 'main' }}" --workflow-ref "${{ github.workflow_ref }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assert protected bootstrap outputs
        shell: pwsh
        env:
          EVALUATION_CONTEXT: ${{ steps.protected-bootstrap.outputs.evaluation-context }}
          POLICY_SOURCE: ${{ steps.protected-bootstrap.outputs.policy-source }}
          VERSION_DISPOSITION: ${{ steps.protected-bootstrap.outputs.version-disposition }}
          OWNER_AUTHORIZATION: ${{ steps.protected-bootstrap.outputs.owner-authorization }}
          POST_MERGE_PROOF: ${{ steps.protected-bootstrap.outputs.post-merge-proof }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVALUATION_CONTEXT -notin @('SELF_PR_BOOTSTRAP', 'STAGE_A_PROTECTED_PROOF', 'DOWNSTREAM_SECURITY_WORKFLOWS')) { throw 'Invalid protected evaluation context output' }
          if ($env:POLICY_SOURCE -notin @('candidate', 'policy')) { throw 'Invalid protected policy source output' }
          if ($env:VERSION_DISPOSITION -notin @('SAME_VERSION', 'IMMEDIATE_SUCCESSOR')) { throw 'Invalid protected version disposition output' }
          if ($env:OWNER_AUTHORIZATION -ne 'REQUIRED') { throw 'Owner authorization output is not REQUIRED' }
          if ($env:POST_MERGE_PROOF -ne 'REQUIRED') { throw 'Post-merge proof output is not REQUIRED' }

      - name: Enforce exact Model D maintenance admission
        if: steps.protected-bootstrap.outputs.evaluation-context == 'SELF_PR_BOOTSTRAP'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -I -S "${{ github.workspace }}/policy/protected_policy_bootstrap.py" admit-maintenance --maintenance-operation MODEL_D_ORCHESTRATION_V1 --maintenance-generation "${{ env.MODEL_D_MAINTENANCE_GENERATION }}" --candidate-sha "${{ github.sha }}" --protected-sha "${{ steps.protected-git.outputs.protected-sha }}" --candidate-root "${{ github.workspace }}/candidate" --protected-root "${{ github.workspace }}/policy"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve protected Model D orchestration
        id: protected-model-d
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -I -S "${{ github.workspace }}/policy/protected_policy_bootstrap.py" run-model-d --event-name "${{ github.event_name }}" --repository "${{ github.repository }}" --base-repository "${{ github.event.pull_request.base.repo.full_name || github.repository }}" --base-branch "${{ github.event.pull_request.base.ref || 'main' }}" --candidate-sha "${{ github.sha }}" --protected-sha "${{ steps.protected-git.outputs.protected-sha }}" --candidate-root "${{ github.workspace }}/candidate" --protected-root "${{ github.workspace }}/policy" --event-ref "${{ github.ref }}" --default-branch "${{ github.event.repository.default_branch || 'main' }}" --workflow-ref "${{ github.workflow_ref }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assert protected Model D outputs
        shell: pwsh
        env:
          D0_CONTEXT: ${{ steps.protected-bootstrap.outputs.evaluation-context }}
          D0_SOURCE: ${{ steps.protected-bootstrap.outputs.policy-source }}
          D0_VERSION: ${{ steps.protected-bootstrap.outputs.version-disposition }}
          MODEL_D_CONTEXT: ${{ steps.protected-model-d.outputs.evaluation-context }}
          MODEL_D_SOURCE: ${{ steps.protected-model-d.outputs.policy-source }}
          MODEL_D_VERSION: ${{ steps.protected-model-d.outputs.version-disposition }}
          MODEL_D_OWNER: ${{ steps.protected-model-d.outputs.owner-authorization }}
          MODEL_D_PROOF: ${{ steps.protected-model-d.outputs.post-merge-proof }}
          NORMALIZATION_ROOTS: ${{ steps.protected-model-d.outputs.normalization-roots }}
          POLICY_LOCK_SOURCE: ${{ steps.protected-model-d.outputs.policy-lock-source }}
          AUDIT_LOCK_SOURCE: ${{ steps.protected-model-d.outputs.audit-lock-source }}
          CANDIDATE_EVIDENCE: ${{ steps.protected-model-d.outputs.candidate-evidence }}
          PROTECTED_EVIDENCE: ${{ steps.protected-model-d.outputs.protected-evidence }}
          DOWNSTREAM_VALIDATION: ${{ steps.protected-model-d.outputs.downstream-validation }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:MODEL_D_CONTEXT -ne $env:D0_CONTEXT -or $env:MODEL_D_SOURCE -ne $env:D0_SOURCE -or $env:MODEL_D_VERSION -ne $env:D0_VERSION) { throw 'Protected Model D outputs differ from D0 authority' }
          if ($env:MODEL_D_OWNER -ne 'REQUIRED' -or $env:MODEL_D_PROOF -ne 'REQUIRED') { throw 'Protected Model D owner/proof contract differs' }
          if ($env:NORMALIZATION_ROOTS -notmatch '^[a-z]+(,[a-z]+)*$') { throw 'Invalid protected normalization roots output' }
          if ($env:POLICY_LOCK_SOURCE -notin @('candidate', 'policy')) { throw 'Invalid protected policy-lock source output' }
          if ($env:AUDIT_LOCK_SOURCE -notin @('candidate', 'policy')) { throw 'Invalid protected audit-lock source output' }
          if ($env:CANDIDATE_EVIDENCE -notin @('RUN_CANDIDATE_STAGE_A_EVIDENCE', 'SKIP')) { throw 'Invalid protected candidate-evidence output' }
          if ($env:PROTECTED_EVIDENCE -notin @('RUN_LEGACY_PROTECTED_HEALTH', 'APPLY_PROTECTED_STAGE_A_TO_CANDIDATE', 'TEST_INDEPENDENT_ROOT_POLICY')) { throw 'Invalid protected evidence output' }
          if ($env:DOWNSTREAM_VALIDATION -notin @('RUN_DOWNSTREAM_VALIDATION', 'SKIP')) { throw 'Invalid protected downstream-validation output' }

      - name: Install isolated hash-locked policy environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv policy-env
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\policy-env\Scripts\python.exe -m pip install --require-hashes --only-binary=:all: -r "${{ steps.protected-model-d.outputs.policy-lock-source }}/requirements-policy.lock"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\policy-env\Scripts\python.exe -c "import yaml; assert yaml.__version__ == '6.0.3'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\policy-env\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run candidate Stage A evidence
        if: steps.protected-model-d.outputs.candidate-evidence == 'RUN_CANDIDATE_STAGE_A_EVIDENCE'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\policy-env\Scripts\python.exe -m unittest discover -s candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run legacy protected health
        if: steps.protected-model-d.outputs.protected-evidence == 'RUN_LEGACY_PROTECTED_HEALTH'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\policy-env\Scripts\python.exe -m unittest discover -s policy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply protected Stage A baseline to candidate target
        if: steps.protected-model-d.outputs.protected-evidence == 'APPLY_PROTECTED_STAGE_A_TO_CANDIDATE'
        shell: pwsh
        env:
          POLICY_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          POLICY_PROTECTED_ROOT: ${{ github.workspace }}/policy
          POLICY_EXPECTED_REPOSITORY: ${{ github.repository }}
          POLICY_EXPECTED_CANDIDATE_SHA: ${{ github.sha }}
          POLICY_EXPECTED_PROTECTED_SHA: ${{ steps.protected-git.outputs.protected-sha }}
          POLICY_EXPECTED_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          POLICY_EXPECTED_BASE_BRANCH: ${{ github.event.pull_request.base.ref || 'main' }}
          POLICY_EXPECTED_EVENT: ${{ github.event_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\policy-env\Scripts\python.exe policy/test_verify_security_workflows.py RootPolicyTests.test_protected_source_and_candidate_target_contract RootPolicyTests.test_stage_a_candidate_invariants RootPolicyTests.test_stage_a_target_binding_executes_in_isolated_git_roots
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test independent root policy
        if: steps.protected-model-d.outputs.protected-evidence == 'TEST_INDEPENDENT_ROOT_POLICY'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\policy-env\Scripts\python.exe -m unittest discover -s policy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install isolated hash-locked audit environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv audit-env
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\audit-env\Scripts\python.exe -m pip install --require-hashes --only-binary=:all: -r "${{ steps.protected-model-d.outputs.audit-lock-source }}/requirements-audit.lock"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\audit-env\Scripts\python.exe -c "import pip_audit; from importlib.metadata import version; assert version('pip-audit') == '2.10.1'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\audit-env\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit locked policy dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\audit-env\Scripts\python.exe -m pip_audit --no-deps -r "${{ steps.protected-model-d.outputs.policy-lock-source }}/requirements-policy.lock"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate downstream security workflows
        if: steps.protected-model-d.outputs.downstream-validation == 'RUN_DOWNSTREAM_VALIDATION'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\policy-env\Scripts\python.exe policy/verify_security_workflows.py --candidate candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
