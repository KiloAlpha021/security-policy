name: security-workflows-policy

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  security-workflows-policy:
    name: security-workflows-policy
    runs-on: windows-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
      - name: Check out independent root policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KiloAlpha021/security-policy
          ref: main
          path: policy
          fetch-depth: 0
      - name: Resolve and verify evaluation context
        shell: pwsh
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || 'main' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $selfRepository = 'KiloAlpha021/security-policy'
          $downstreamRepository = 'KiloAlpha021/security-workflows'
          if ($env:EVENT_NAME -eq 'pull_request' -and
              $env:EVENT_REPOSITORY -eq $selfRepository -and
              $env:BASE_REPOSITORY -eq $selfRepository -and
              $env:BASE_BRANCH -eq 'main') {
            $evaluationContext = 'SELF_PR_BOOTSTRAP'
            $policySource = 'candidate'
          } elseif ($env:EVENT_NAME -in @('pull_request', 'merge_group') -and
                    $env:EVENT_REPOSITORY -eq $downstreamRepository -and
                    $env:BASE_REPOSITORY -eq $downstreamRepository -and
                    $env:BASE_BRANCH -eq 'main') {
            $evaluationContext = 'DOWNSTREAM_SECURITY_WORKFLOWS'
            $policySource = 'policy'
          } else {
            throw 'Unsupported or ambiguous policy evaluation context'
          }
          if ($env:CANDIDATE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Invalid candidate SHA' }
          $candidateRoot = (Resolve-Path candidate).Path
          $policyRoot = (Resolve-Path policy).Path
          if ($candidateRoot -eq $policyRoot -or
              $candidateRoot.StartsWith($policyRoot + [IO.Path]::DirectorySeparatorChar) -or
              $policyRoot.StartsWith($candidateRoot + [IO.Path]::DirectorySeparatorChar)) {
            throw 'Candidate and protected-policy roots must be separate'
          }
          $candidateRemote = (& git -C candidate remote get-url origin).Trim().TrimEnd('/')
          $policyRemote = (& git -C policy remote get-url origin).Trim().TrimEnd('/')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($candidateRemote -notin @("https://github.com/$($env:EVENT_REPOSITORY)", "https://github.com/$($env:EVENT_REPOSITORY).git")) {
            throw 'Candidate checkout repository mismatch'
          }
          if ($policyRemote -notin @('https://github.com/KiloAlpha021/security-policy', 'https://github.com/KiloAlpha021/security-policy.git')) {
            throw 'Protected-policy checkout repository mismatch'
          }
          $candidateHead = (& git -C candidate rev-parse HEAD).Trim()
          $policyHead = (& git -C policy rev-parse HEAD).Trim()
          $protectedMain = (& git -C policy rev-parse refs/remotes/origin/main).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($candidateHead -ne $env:CANDIDATE_SHA) { throw 'Candidate checkout does not match event SHA' }
          if ($policyHead -ne $protectedMain) { throw 'Protected-policy checkout is not protected main' }
          if ($evaluationContext -eq 'SELF_PR_BOOTSTRAP') {
            $allowed = @(
              '.github/workflows/security-workflows-policy.yml',
              'requirements-audit.lock',
              'requirements-policy.lock',
              'test_verify_security_workflows.py',
              'verify_security_workflows.py'
            )
            $allowedSet = [Collections.Generic.HashSet[string]]::new(
              $allowed, [StringComparer]::Ordinal
            )
            $start = [Diagnostics.ProcessStartInfo]::new()
            $start.FileName = 'git'
            $start.WorkingDirectory = (Resolve-Path candidate).Path
            $start.UseShellExecute = $false
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            foreach ($argument in @('diff', '--raw', '-z', '--no-renames', '--no-ext-diff', $policyHead, $candidateHead, '--')) {
              [void]$start.ArgumentList.Add($argument)
            }
            $process = [Diagnostics.Process]::Start($start)
            $buffer = [IO.MemoryStream]::new()
            $process.StandardOutput.BaseStream.CopyTo($buffer)
            $errorText = $process.StandardError.ReadToEnd()
            $process.WaitForExit()
            if ($process.ExitCode -ne 0) { throw "Unable to determine bounded self-PR scope: $errorText" }
            $raw = $buffer.ToArray()
            if ($raw.Length -eq 0 -or $raw[-1] -ne 0) { throw 'Empty or malformed self-PR Git diff' }
            $tokens = [Text.Encoding]::UTF8.GetString($raw, 0, $raw.Length - 1).Split([char]0)
            if ($tokens.Count % 2 -ne 0) { throw 'Ambiguous self-PR Git diff records' }
            $changed = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
            for ($index = 0; $index -lt $tokens.Count; $index += 2) {
              $metadata = $tokens[$index]
              $path = $tokens[$index + 1]
              if ($metadata -notmatch '^:100644 100644 [0-9a-f]{40} [0-9a-f]{40} M$') {
                throw "Unsupported self-PR file status or mode: $metadata"
              }
              $components = $path.Split('/')
              if ([string]::IsNullOrEmpty($path) -or [IO.Path]::IsPathRooted($path) -or
                  $path.Contains('\\') -or $components -contains '' -or
                  $components -contains '.' -or $components -contains '..' -or
                  -not $allowedSet.Contains($path)) {
                throw "Noncanonical or unsupported self-PR path: $path"
              }
              if (-not $changed.Add($path)) { throw "Duplicate self-PR path identity: $path" }
            }
            if ($changed.Count -eq 0) { throw 'Security-policy self-PR change set is empty' }
            if (($changed.Contains('requirements-policy.lock') -or
                 $changed.Contains('requirements-audit.lock')) -and
                -not $changed.Contains('test_verify_security_workflows.py')) {
              throw 'Policy lock changes require protected contract tests'
            }
          }
          "EVALUATION_CONTEXT=$evaluationContext" >> $env:GITHUB_ENV
          "POLICY_SOURCE=$policySource" >> $env:GITHUB_ENV
      - name: Normalize and verify committed policy bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($root in @('candidate', 'policy')) {
            & git -C $root config core.autocrlf false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & git -C $root reset --hard HEAD
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($lock in @('requirements-policy.lock', 'requirements-audit.lock')) {
            $committedBlob = (& git -C $env:POLICY_SOURCE rev-parse "HEAD`:$lock").Trim()
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $worktreeBlob = (& git -C $env:POLICY_SOURCE hash-object --no-filters $lock).Trim()
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($worktreeBlob -ne $committedBlob) { throw "Policy lock bytes differ from committed Git bytes: $lock" }
          }
      - name: Set up CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.10
      - name: Assert exact CPython runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonVersion = & python -c "import platform; print(platform.python_version())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($pythonVersion -ne '3.12.10') { throw 'Unexpected CPython version' }
      - name: Install isolated hash-locked policy environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv policy-env
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\policy-env\Scripts\python.exe -m pip install --require-hashes --only-binary=:all: -r "$env:POLICY_SOURCE/requirements-policy.lock"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $yamlVersion = & .\policy-env\Scripts\python.exe -c "import yaml; print(yaml.__version__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($yamlVersion -ne '6.0.3') { throw 'Unexpected PyYAML version' }
          .\policy-env\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test independent root policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\policy-env\Scripts\python.exe -m unittest discover -s $env:POLICY_SOURCE -p test_verify_security_workflows.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate candidate against protected baseline
        if: env.EVALUATION_CONTEXT == 'SELF_PR_BOOTSTRAP'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path protected-baseline) { Remove-Item protected-baseline -Recurse -Force }
          Copy-Item candidate protected-baseline -Recurse
          Copy-Item policy/test_verify_security_workflows.py protected-baseline/test_verify_security_workflows.py -Force
          $env:POLICY_CONTRACT_TARGET = (Resolve-Path protected-baseline).Path
          .\policy-env\Scripts\python.exe policy/test_verify_security_workflows.py RootPolicyTests.test_policy_dependency_workflow_contract RootPolicyTests.test_policy_dependency_lock_identities RootPolicyTests.test_protected_candidate_validator_contract -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install isolated hash-locked audit environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv audit-env
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\audit-env\Scripts\python.exe -m pip install --require-hashes --only-binary=:all: -r "$env:POLICY_SOURCE/requirements-audit.lock"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $auditVersion = & .\audit-env\Scripts\python.exe -m pip_audit --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($auditVersion -ne 'pip-audit 2.10.1') { throw 'Unexpected audit tool version' }
          .\audit-env\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit independent root policy dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\audit-env\Scripts\python.exe -m pip_audit --no-deps -r "$env:POLICY_SOURCE/requirements-policy.lock"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Apply independent security-workflows policy
        if: env.EVALUATION_CONTEXT == 'DOWNSTREAM_SECURITY_WORKFLOWS'
        shell: pwsh
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || 'main' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\policy-env\Scripts\python.exe policy/verify_security_workflows.py --candidate candidate --policy policy --event-repository $env:EVENT_REPOSITORY --candidate-sha $env:CANDIDATE_SHA --base-repository $env:BASE_REPOSITORY --base-branch $env:BASE_BRANCH --event-name $env:EVENT_NAME
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
